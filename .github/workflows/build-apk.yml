name: Build LichAmDuong APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  BUILDOZER_VERSION: "1.6.0"
  P4A_COMMIT: "58d2114"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev libsqlite3-dev gettext

      - name: Install pinned Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "cython<3.4"
          buildozer --version

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          test -f lunar.py
          test -f buildozer.spec
          test -f requirements.txt
          ! grep -q $'\xEF\xBB\xBF' buildozer.spec || true
          python - <<'PY'
          from pathlib import Path
          spec = Path('buildozer.spec').read_text(encoding='utf-8')
          req = Path('requirements.txt').read_text(encoding='utf-8')
          required = [
              'requirements = python3==3.11.9,kivy==2.3.1',
              'android.api = 35',
              'android.minapi = 24',
              'android.ndk = 28c',
              'android.archs = arm64-v8a',
              'p4a.commit = 58d2114',
          ]
          for item in required:
              assert item in spec, f'Missing config: {item}'
          assert 'python3==3.11.9' in req
          assert 'kivy==2.3.1' in req
          print('Project configuration OK')
          PY

      - name: Cache Buildozer and Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-ubuntu22-python311-p4a-${{ env.P4A_COMMIT }}-ndk28c-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-ubuntu22-python311-p4a-${{ env.P4A_COMMIT }}-ndk28c-
            buildozer-ubuntu22-python311-

      - name: Clean stale build state
        run: |
          rm -rf .buildozer bin

      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo "===== APK FILES ====="
          find bin -type f -name '*.apk' -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichAmDuong-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
