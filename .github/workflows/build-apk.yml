name: Build LichAmDuong APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install "cython<3"
          python -m pip install buildozer

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Fix buildozer.spec encoding
        run: |
          python -c "from pathlib import Path; p=Path('buildozer.spec'); b=p.read_bytes(); p.write_bytes(b[3:] if b.startswith(bytes([239,187,191])) else b)"
          echo "===== buildozer.spec ====="
          sed -n '1,30p' buildozer.spec

      - name: Validate buildozer.spec
        run: |
          python -c "from pathlib import Path; b=Path('buildozer.spec').read_bytes(); assert not b.startswith(bytes([239,187,191])), 'UTF-8 BOM still exists'; assert b'[app]' in b, 'Missing [app] section'; print('buildozer.spec OK')"

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: List generated APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichAmDuong-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30