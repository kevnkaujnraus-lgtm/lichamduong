name: Build LichAmDuong APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-22.04

    timeout-minutes: 60

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Java
      # ------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------
      # Android / Build dependencies
      # ------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # ------------------------------------------------------
      # Python dependencies
      # ------------------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          pip install "cython<3"
          pip install buildozer

      # ------------------------------------------------------
      # Cache Buildozer / Android SDK
      # ------------------------------------------------------

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ------------------------------------------------------
      # Build APK
      # ------------------------------------------------------

            - name: Fix buildozer.spec encoding
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          data = p.read_bytes()

          if data.startswith(b"\xef\xbb\xbf"):
              data = data[3:]
              p.write_bytes(data)
              print("UTF-8 BOM removed from buildozer.spec")
          else:
              print("buildozer.spec has no UTF-8 BOM")
          PY

          echo "===== buildozer.spec ====="
          head -n 20 buildozer.spec

      - name: Build APK
        run: |
          yes | buildozer android debug
      # ------------------------------------------------------
      # Show APK
      # ------------------------------------------------------

      - name: List generated APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      # ------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichAmDuong-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
